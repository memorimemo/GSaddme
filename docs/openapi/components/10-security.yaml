components:
  securitySchemes:
    bearerClientAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by `POST /api/v1/auth/token` or `POST /api/v1/auth/refresh`
    bearerAdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by `POST /api/v1/auth/admin/token`
